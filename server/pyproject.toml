[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Mathew Shaldin", email = "mathew.shaldin@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.20.0",
  "asyncpg>=0.32.0",
  "bcrypt>=5.0.0",
  "fastapi>=0.158.1",
  "httpx>=0.28.1",
  "passlib>=1.7.4",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "pytest>=9.1.1",
  "python-dotenv>=1.2.4",
  "python-jose>=3.5.0",
  "sqlalchemy>=2.1.6",
  "uvicorn>=0.54.0",
]

[project.scripts]
server = "server:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "ruff>=0.17.1",
]
